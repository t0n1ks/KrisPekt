name: Render baselines

# Draws the Linux baseline images of tests/e2e/render-parity.spec.ts in the environment the
# deploy workflow tests in, and offers them as a download. Nothing is committed from here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test render-parity --update-snapshots=all

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-baselines
          path: tests/e2e/render-parity.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
