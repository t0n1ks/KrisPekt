version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (peer range is <6.1.0).
      # Remove this rule once typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The types follow the major version of Node we run on, so a newer major would let code
      # use APIs that this Node does not have. Move this together with Node itself.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
