<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>KrisPekt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: library = shelves of school-notebook covers grouped by subject; editor = full-bleed desk canvas with a floating tool tray */
:root{
  --desk:#E3E7ED; --surface:#FFFFFF; --surface-2:#F0F2F6; --line:#D2D8E1; --fg:#171C26; --muted:#596273;
  --accent:#2343B0; --accent-soft:#E2E8FB; --accent-fg:#FFFFFF; --danger:#C22A36;
  --warn-soft:#FBEBD1; --warn-fg:#7D4C00; --scrim:rgba(16,22,34,.44); --shadow:rgba(22,32,52,.18);
  --ruler:rgba(255,255,255,.82); --page-label:#7A8494;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#111418; --surface:#1B1F26; --surface-2:#252A33; --line:#323944; --fg:#E6E9EF; --muted:#9AA3B2;
  --accent:#8BA7FF; --accent-soft:#25304A; --accent-fg:#0C1226; --danger:#FF6F79;
  --warn-soft:#3A2E1B; --warn-fg:#F3C47E; --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.55);
  --ruler:rgba(34,39,48,.86); --page-label:#7D8696; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#111418; --surface:#1B1F26; --surface-2:#252A33; --line:#323944; --fg:#E6E9EF; --muted:#9AA3B2;
  --accent:#8BA7FF; --accent-soft:#25304A; --accent-fg:#0C1226; --danger:#FF6F79;
  --warn-soft:#3A2E1B; --warn-fg:#F3C47E; --scrim:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.55);
  --ruler:rgba(34,39,48,.86); --page-label:#7D8696; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.36;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:block;flex:none}
input[type=range]{accent-color:var(--accent);width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- library ---------- */
#library{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lib{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:22px 120px}
.lib-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(22px,4.2vw,30px);letter-spacing:-.02em;line-height:1.1}
.brand-sub{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding-inline:12px;height:44px;margin-top:18px;color:var(--muted)}
.search input{border:0;background:none;outline:none;font:inherit;color:var(--fg);flex:1;min-width:0;height:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;color:var(--fg)}
.icon-btn:hover{background:var(--surface-2)}
.warnbar{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn-fg);font-size:14px}
.subject{margin-top:34px}
.subject-head{display:flex;align-items:center;gap:12px;min-width:0}
.spine{width:8px;height:30px;border-radius:2px;background:var(--sc);flex:none}
.subject-name{margin:0;font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.subject-head .icon-btn{margin-left:auto}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:22px 18px;margin-top:14px}
.nb{display:flex;flex-direction:column;gap:6px;min-width:0}
.cover{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:3/4;border-radius:3px 9px 9px 3px;background:var(--cv);box-shadow:0 1px 1px rgba(0,0,0,.14),0 10px 20px -10px var(--shadow);overflow:hidden;text-align:left;transition:transform .15s ease}
.cover::before{content:"";position:absolute;top:0;bottom:0;left:0;width:9%;background:rgba(0,0,0,.2)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 45%)}
.cover:hover{transform:translateY(-2px)}
.label{position:absolute;left:19%;right:9%;top:19%;z-index:1;background:#FAFAF6;color:#1E2330;border-radius:3px;padding:8px 9px 9px;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 0 rgba(0,0,0,.1)}
.kicker{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#69707F;font-weight:600}
.lt{font-family:var(--f-display);font-weight:500;font-size:12.5px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ls{font-size:10.5px;color:#5A6170;border-top:1px solid #D8DBE2;padding-top:4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;right:8px;bottom:8px;z-index:1;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.92);color:#1E2330;padding:2px 6px;border-radius:5px}
.nb-meta{display:flex;align-items:center;gap:2px;min-width:0}
.nb-meta .mt{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.nb-meta .icon-btn{width:34px;height:34px}
.add-nb{width:100%;aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:3px 9px 9px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;padding:8px;text-align:center}
.add-nb:hover{border-color:var(--accent);color:var(--accent)}
.lib-foot{margin-top:40px;display:flex;gap:10px;flex-wrap:wrap}
.empty{margin-top:48px;max-width:460px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:20px}
.empty p{margin:0;color:var(--muted)}
.muted{color:var(--muted)}

/* ---------- editor ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--desk);z-index:5}
.top{display:flex;align-items:center;gap:2px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;background:var(--surface);border-bottom:1px solid var(--line);min-height:54px;flex:none}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding:2px 6px;text-align:left;border-radius:8px}
.ttl b{font-family:var(--f-display);font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ttl span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pill{height:36px;padding:0 10px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;background:var(--surface-2);white-space:nowrap;flex:none}
.pill.unlocked{background:var(--warn-soft);color:var(--warn-fg)}
.zoom{min-width:58px;justify-content:center}
@media (max-width:560px){.zoom{display:none}.pill{padding:0 8px}}
.stage{position:relative;flex:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;left:0;top:0}
#live{pointer-events:none}
.tray{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px -14px var(--shadow);z-index:3;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tool{position:relative;width:42px;height:42px;flex:none;border-radius:11px;display:grid;place-items:center}
.tool:hover{background:var(--surface-2)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool .dot{position:absolute;right:6px;bottom:6px;width:9px;height:9px;border-radius:50%;background:var(--dc);box-shadow:0 0 0 2px var(--surface)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.sw{width:32px;height:42px;flex:none;display:grid;place-items:center}
.sw i{width:20px;height:20px;border-radius:50%;background:var(--c);display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.sw.on i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.fab{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:17px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 12px 26px -10px var(--shadow);z-index:3}
@media (max-width:640px){
  .tool{width:38px;height:40px}
  .sw{width:28px}
  .tray{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .fab{bottom:calc(78px + env(safe-area-inset-bottom,0px));width:50px;height:50px}
}
#ruler{position:absolute;left:0;top:0;height:64px;transform-origin:50% 50%;background:var(--ruler);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 20px -10px var(--shadow);z-index:2;touch-action:none}
#ruler canvas{position:absolute;left:0;top:0;pointer-events:none}
#ruler .ang{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
#textEd{position:absolute;z-index:2;border:0;outline:1.5px dashed #2343B0;outline-offset:4px;background:transparent;resize:none;overflow:hidden;padding:0;margin:0;font-family:var(--f-body);font-weight:400;white-space:pre-wrap;overflow-wrap:break-word;caret-color:#2343B0;line-height:1.35}
.selbar{position:absolute;z-index:3;display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 24px -12px var(--shadow)}
.selbar .icon-btn{width:38px;height:38px}
.selbar .icon-btn.danger{color:var(--danger)}
.popover{touch-action:manipulation;position:absolute;z-index:6;width:min(320px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 20px 40px -18px var(--shadow);display:flex;flex-direction:column;gap:14px}
.popover h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.popover canvas{width:100%;height:46px;border-radius:10px;background:#FFFFFF;box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;align-items:center;gap:10px}
.row label{flex:1;font-size:14px}
.panel{touch-action:pan-y;position:absolute;top:0;right:0;bottom:0;width:min(300px,88vw);background:var(--surface);border-left:1px solid var(--line);z-index:4;display:flex;flex-direction:column;box-shadow:-20px 0 40px -24px var(--shadow)}
.panel-head{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;flex:1;font-size:15px;font-weight:600}
.plist{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.pitem{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:8px;border-radius:12px}
.pitem.on{background:var(--accent-soft)}
.pthumb{display:block;padding:0}
.pthumb canvas{display:block;border-radius:2px;background:#FFFFFF;box-shadow:0 0 0 1px var(--line),0 4px 10px -6px var(--shadow)}
.pinfo{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13px}
.pinfo b{font-size:14px}
.pinfo .sz{display:flex;align-items:center;gap:5px;color:var(--muted)}
.pact{display:flex;gap:0;margin-top:6px;margin-left:-8px}
.pact .icon-btn{width:34px;height:34px}
.panel-foot{padding:10px;border-top:1px solid var(--line)}

/* ---------- sheets, menus, toast ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(540px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);display:flex;flex-direction:column}
@media (max-width:640px){.scrim{align-items:flex-end;padding:0}.sheet{width:100%;border-radius:18px 18px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 10px 4px 20px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet-head h2{margin:0;flex:1;font-family:var(--f-display);font-weight:500;font-size:17px;text-wrap:balance}
.sheet-body{padding:8px 20px 18px;display:flex;flex-direction:column;gap:20px}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.input{height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:0 12px;font:inherit;width:100%}
.input:focus{outline:2px solid var(--accent);outline-offset:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;align-self:flex-start}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:500}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px var(--shadow)}
.custom{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.custom .input{width:84px;height:38px;font-variant-numeric:tabular-nums}
.sizepick{display:flex;flex-direction:column;gap:12px}
.disabled{opacity:.42;pointer-events:none}
.colors{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cdot{width:32px;height:32px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);flex:none}
.cdot.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.cpick{width:32px;height:32px;border-radius:50%;overflow:hidden;position:relative;background:conic-gradient(#E53935,#FDD835,#43A047,#1E88E5,#8E24AA,#E53935);flex:none}
.cpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.paper{width:22px;height:28px;border-radius:2px;background-color:#FFFFFF;box-shadow:0 0 0 1px rgba(0,0,0,.2);flex:none}
.paper.grid{background-image:linear-gradient(#BCCDE3 1px,transparent 1px),linear-gradient(90deg,#BCCDE3 1px,transparent 1px);background-size:5px 5px}
.paper.gridm{background-image:linear-gradient(90deg,transparent 16px,#E47F86 16px,#E47F86 17px,transparent 17px),linear-gradient(#BCCDE3 1px,transparent 1px),linear-gradient(90deg,#BCCDE3 1px,transparent 1px);background-size:100% 100%,5px 5px,5px 5px}
.paper.lines{background-image:linear-gradient(#B7C9E2 1px,transparent 1px);background-size:100% 5px}
.paper.dots{background-image:radial-gradient(#93A9C6 .9px,transparent 1.1px);background-size:5px 5px}
.lockrow{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;text-align:left;width:100%;border:1px solid transparent}
.lockrow.locked{background:var(--accent-soft);color:var(--fg)}
.lockrow.locked .lk{color:var(--accent)}
.lockrow.unlocked{background:var(--warn-soft);color:var(--warn-fg)}
.lockrow b{display:block;font-size:15px}
.lockrow small{display:block;font-size:13px;opacity:.85}
.lk{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none}
.hint{font-size:13px;color:var(--muted);margin:0}
.next{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px}
.menu{position:fixed;z-index:30;min-width:230px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 22px 50px -20px var(--shadow)}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:9px;text-align:left;font-size:14.5px}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:var(--danger)}
.menu-item .mi-check{margin-left:auto;color:var(--accent);width:18px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 14px 30px -12px var(--shadow);text-align:center}
@media (min-width:641px){body.editing .toast{top:calc(124px + env(safe-area-inset-top,0px))}}
.prose{display:flex;flex-direction:column;gap:10px;font-size:14.5px;max-width:65ch}
.prose p{margin:0}
</style>
</head>
<body>
<div id="app">
  <section id="library" aria-label="Полка конспектов">
    <div class="lib">
      <div class="lib-head">
        <div>
          <h1 class="brand">KrisPekt</h1>
          <p class="brand-sub" id="libSub">Предметы и тетради</p>
        </div>
        <div class="head-actions">
          <button class="btn" id="btnAddSubject" type="button"></button>
          <button class="btn primary" id="btnAddNb" type="button"></button>
          <button class="pill" id="btnLang" type="button"></button>
          <button class="icon-btn" id="btnLibMore" type="button" aria-label="Ещё"></button>
        </div>
      </div>
      <label class="search" for="q"><span id="searchIc"></span><input id="q" type="search" placeholder="Найти тетрадь или предмет" autocomplete="off"></label>
      <div id="libWarn"></div>
      <div id="libList"></div>
    </div>
  </section>

  <section id="editor" hidden aria-label="Тетрадь">
    <header class="top">
      <button class="icon-btn" id="btnBack" type="button" aria-label="К полке"></button>
      <button class="ttl" id="btnTitle" type="button" aria-label="Настройки тетради"><b id="edTitle"></b><span id="edSub"></span></button>
      <button class="pill zoom" id="btnZoom" type="button" aria-label="Вписать по ширине"></button>
      <button class="pill" id="btnLock" type="button" aria-label="Размер страницы"></button>
      <button class="pill" id="btnPages" type="button" aria-label="Страницы"></button>
      <button class="icon-btn" id="btnUndo" type="button" aria-label="Отменить"></button>
      <button class="icon-btn" id="btnRedo" type="button" aria-label="Повторить"></button>
      <button class="icon-btn" id="btnEdMore" type="button" aria-label="Ещё"></button>
    </header>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <canvas id="live"></canvas>
      <div id="ruler" hidden><canvas></canvas><span class="ang">0°</span></div>
      <textarea id="textEd" hidden spellcheck="true" aria-label="Текст"></textarea>
      <div class="selbar" id="selbar" hidden></div>
      <div class="tray" id="tray" role="toolbar" aria-label="Инструменты"></div>
      <button class="fab" id="fab" type="button" aria-label="Добавить страницу"></button>
      <aside class="panel" id="panel" hidden aria-label="Страницы тетради">

/* ================= storage (IndexedDB, with in-memory fallback) ================= */
const Store = {
  db: null, mem: null,
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('konspektnik', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('subjects')) d.createObjectStore('subjects', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('notebooks')) d.createObjectStore('notebooks', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('pages')) d.createObjectStore('pages', { keyPath: 'id' }).createIndex('nb', 'nbId');
          if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('timeout')), 5000);
      });
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
      return true;
    } catch (e) {
      this.db = null;
      this.mem = { subjects: new Map(), notebooks: new Map(), pages: new Map(), blobs: new Map() };
      return false;
    }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      let t;
      try { t = this.db.transaction(store, mode); } catch (e) { rej(e); return; }
      let out;
      const r = fn(t.objectStore(store));
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('abort'));
    });
  },
  all(store) { if (!this.db) return Promise.resolve([...this.mem[store].values()]); return this._tx(store, 'readonly', (s) => s.getAll()); },
  get(store, id) { if (!this.db) return Promise.resolve(this.mem[store].get(id)); return this._tx(store, 'readonly', (s) => s.get(id)); },
  put(store, obj) { if (!this.db) { this.mem[store].set(obj.id, obj); return Promise.resolve(); } return this._tx(store, 'readwrite', (s) => s.put(obj)); },
  putMany(store, arr) { if (!arr.length) return Promise.resolve(); if (!this.db) { arr.forEach((o) => this.mem[store].set(o.id, o)); return Promise.resolve(); } return this._tx(store, 'readwrite', (s) => { arr.forEach((o) => s.put(o)); return null; }); },
  del(store, id) { if (!this.db) { this.mem[store].delete(id); return Promise.resolve(); } return this._tx(store, 'readwrite', (s) => s.delete(id)); },
  delMany(store, ids) { if (!ids.length) return Promise.resolve(); if (!this.db) { ids.forEach((i) => this.mem[store].delete(i)); return Promise.resolve(); } return this._tx(store, 'readwrite', (s) => { ids.forEach((i) => s.delete(i)); return null; }); },
  pagesOf(nbId) { if (!this.db) return Promise.resolve([...this.mem.pages.values()].filter((p) => p.nbId === nbId)); return this._tx('pages', 'readonly', (s) => s.index('nb').getAll(nbId)); },
};

function openSheet(title, body, actions = [], opts = {}) {

  const box = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    el('div', { class: 'sheet-head' }, el('h2', null, title), el('button', { class: 'icon-btn', type: 'button', 'aria-label': t('close'), html: icon('close'), onclick: () => close() })),
    el('div', { class: 'sheet-body' }, body));
  if (actions.length) {
    const foot = el('div', { class: 'sheet-foot' });
    for (const a of actions) {
      foot.append(el('button', {
        class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''), type: 'button',
        onclick: async () => { const r = a.onClick ? await a.onClick() : undefined; if (r !== false) close(); },
      }, a.label));

    box.append(foot);

  scrim.append(box);

  scrim.addEventListener('pointerdown', (e) => { if (e.target === scrim) close(); });
  let closed = false;
  function close() { if (closed) return; closed = true; scrim.remove(); if (opts.onClose) opts.onClose(); }
  if (opts.focus) setTimeout(() => { const f = box.querySelector('input[type=text]'); if (f) f.focus(); }, 60);
  return { close, box };
}

}
let menuEl = null;

}

  }

/* ================= downloads ================= */
let dlPromise = null;
function getDownloads() {
  if (!dlPromise) {
    dlPromise = (window.claude && typeof window.claude.use === 'function')
      ? Promise.race([window.claude.use('downloads').catch(() => null), new Promise((r) => setTimeout(() => r(null), 8000))])
      : Promise.resolve(null);
  }
  return dlPromise;
}
async function saveFile(name, blob) {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast(t('fileSaved')); return; }
    catch (err) {
      const code = err && err.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') { toast(t('waitRetry')); return; }
      if (code === 'too_large') { toast(t('tooLarge')); return; }
      /* otherwise fall through to a plain browser download */
    }
  }
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: name, style: 'display:none' });
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
  toast(t('dlStarted'));
}

async function deleteSubject(sub) {

  const ok = await confirmBox(t('delSubjQ'), nbs.length
    ? t('delSubjText', { s: sub.name, n: pl(nbs.length, 'nb') })

  if (!ok) return;
  for (const nb of nbs) await removeNotebookData(nb);
  S.subjects = S.subjects.filter((s) => s !== sub);

async function removeNotebookData(nb) {

async function createNotebook(st, firstPages) {

async function createNotebookFromPdf(st) {

  if (st.title === t('untitled')) st.title = f.name.replace(/\.pdf$/i, '').slice(0, 80);

}
async function updateNotebook(nb, st) {
  const baseChanged = Math.abs(nb.base.w - st.base.w) > 0.01 || Math.abs(nb.base.h - st.base.h) > 0.01;
  Object.assign(nb, { title: st.title, subjectId: st.subjectId, color: st.color, bg: st.bg, base: { ...st.base }, updatedAt: Date.now() });
  await Store.put('notebooks', nb);
  if (S.nb === nb) {
    if (baseChanged) {
      for (const p of S.pages) if (p.locked) { p.w = nb.base.w; p.h = nb.base.h; touch(p); }
      layout(); clampCam(); requestRender();
      if (!$('#panel').hidden) renderPanel();
    }
    updateTitle();
  }
  renderLibrary();

async function exportBackup() {
  await flush();
  toast(t('collecting'), 0);
  try {
    const [subjects, notebooks, pages, blobs] = await Promise.all(['subjects', 'notebooks', 'pages', 'blobs'].map((s) => Store.all(s)));
    const outPages = pages.map((p) => ({ ...p, strokes: (p.strokes || []).map((s) => ({ ...s, p: Array.from(s.p, (v) => Math.round(v * 100) / 100) })) }));
    const outBlobs = [];
    for (const b of blobs) outBlobs.push({ id: b.id, type: b.blob.type, data: await blobToB64(b.blob) });
    const json = JSON.stringify({ app: 'krispekt', version: 1, exportedAt: new Date().toISOString(), subjects, notebooks, pages: outPages, blobs: outBlobs });
    const d = new Date();
    await saveFile(`krispekt-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`, new Blob([json], { type: 'application/json' }));
  } catch (e) { toast(t('backupFail')); }
}
async function importBackup() {

  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (e) { toast(t('notBackup')); return; }
  if (!data || (data.app !== 'krispekt' && data.app !== 'konspektnik') || !Array.isArray(data.notebooks) || !Array.isArray(data.subjects)) { toast(t('notBackup')); return; }

    const pages = (data.pages || []).map((p) => ({ ...p, strokes: (p.strokes || []).map((s) => ({ ...s, p: new Float32Array(s.p) })) }));
    await Store.putMany('pages', pages);

const stage = $('#stage'), cv = $('#cv'), live = $('#live');

const pageCache = new Map();

/* ================= strokes: geometry ================= */
const pathCache = new WeakMap(), bboxCache = new WeakMap();
let layoutCache = new WeakMap();

  for (let i = 0; i < n; i++) {
    const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
    let dx = a[i1 * 3] - a[i0 * 3], dy = a[i1 * 3 + 1] - a[i0 * 3 + 1];
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const nx = -dy, ny = dx, hw = penWidth(s, a[i * 3 + 2]) / 2;

  for (let i = n - 2; i >= 0; i--) P.quadraticCurveTo(R[(i + 1) * 2], R[(i + 1) * 2 + 1], (R[(i + 1) * 2] + R[i * 2]) / 2, (R[(i + 1) * 2 + 1] + R[i * 2 + 1]) / 2);

  P.arc(a[0], a[1], ws, A[0] + Math.PI, A[0], true);

}

  for (let i = 1; i < n; i++) P.quadraticCurveTo(a[(i - 1) * 3], a[(i - 1) * 3 + 1], (a[(i - 1) * 3] + a[i * 3]) / 2, (a[(i - 1) * 3 + 1] + a[i * 3 + 1]) / 2);

const measCtx = document.createElement('canvas').getContext('2d');
function textLines(t) {

    const words = para.split(/(\s+)/); let line = '';

  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFW;
}
async function pdfToPages(file, nbId) {
  toast(t('pdfOpening'), 0);
  try { await ensurePdfJs(); } catch (e) { toast(t('pdfModuleFail'), 4000); return []; }
  let pdf;
  try { pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; }
  catch (e) { toast(t('pdfOpenFail'), 3500); return []; }
  const out = [];
  try {
    for (let i = 1; i <= pdf.numPages; i++) {
      toast(t('pdfProgress', { i, n: pdf.numPages }), 0);
      const pg = await pdf.getPage(i);
      const vp1 = pg.getViewport({ scale: 1 });
      const scale = Math.min(1800 / vp1.width, 3);
      const vp = pg.getViewport({ scale });
      const c = el('canvas', { width: Math.ceil(vp.width), height: Math.ceil(vp.height) });
      const x = c.getContext('2d'); x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height);
      await pg.render({ canvasContext: x, viewport: vp }).promise;
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.86));
      const bid = uid();
      await Store.put('blobs', { id: bid, blob });
      out.push({ id: uid(), nbId, w: vp1.width * 25.4 / 72, h: vp1.height * 25.4 / 72, locked: false, bg: 'plain', bgBlob: bid, strokes: [], texts: [], images: [], updatedAt: Date.now() });
      c.width = 0; c.height = 0; pg.cleanup();
    }
  } catch (e) { toast(t('pdfPartial', { n: out.length }), 4000); }
  try { pdf.destroy(); } catch (e) { /* ignore */ }
  if (out.length) toast(t('pdfDone', { n: pl(out.length, 'pg') }), 2600);
  return out;
}
async function importPdfHere() {
  const f = await pickFile('application/pdf,.pdf');
  if (!f) return;
  const ref = currentPage();
  const pages = await pdfToPages(f, S.nb.id);
  if (!pages.length) return;
  insertPages(ref, pages);
  await flush(true);
  scrollToPage(pages[0].id);
}
async function exportNotebookPdf(nb) {
  await flush(true);
  toast(t('pdfPreparing'), 0);
  try { if (!window.jspdf) await loadScript(JSPDF); } catch (e) { toast(t('pdfModuleFail'), 4000); return; }
  const pages = S.nb === nb ? S.pages : await loadPagesOrdered(nb);
  const { jsPDF } = window.jspdf;
  let doc = null;
  for (let i = 0; i < pages.length; i++) {
    toast(t('pdfExportProgress', { i: i + 1, n: pages.length }), 0);
    const p = pages[i];
    const bms = await ensureBitmaps(p);
    const sc = 2, c = el('canvas', { width: Math.round(p.w * MM * sc), height: Math.round(p.h * MM * sc) });
    const x = c.getContext('2d'); x.setTransform(sc, 0, 0, sc, 0, 0);
    drawPageContent(x, p, sc, null, bms);
    const data = c.toDataURL('image/jpeg', 0.9);
    const wpt = p.w * 72 / 25.4, hpt = p.h * 72 / 25.4, o = wpt > hpt ? 'l' : 'p';
    if (!doc) doc = new jsPDF({ unit: 'pt', format: [wpt, hpt], orientation: o, compress: true });
    else doc.addPage([wpt, hpt], o);
    doc.addImage(data, 'JPEG', 0, 0, wpt, hpt, undefined, 'FAST');
    c.width = 0; c.height = 0;
    await new Promise((r) => setTimeout(r, 0));
  }
  if (!doc) { toast(t('noPages')); return; }
  await saveFile(safeName(nb.title) + '.pdf', doc.output('blob'));
}

/* ================= language ================= */
function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = 'KrisPekt';
  const set = (sel, attr, key) => { const n = $(sel); if (n) n.setAttribute(attr, t(key)); };
  set('#library', 'aria-label', 'libAria'); set('#btnLibMore', 'aria-label', 'more'); set('#q', 'placeholder', 'searchPh');
  set('#editor', 'aria-label', 'notebook'); set('#btnBack', 'aria-label', 'toShelf'); set('#btnTitle', 'aria-label', 'nbSettings');
  set('#btnZoom', 'aria-label', 'fitWidth'); set('#btnPages', 'aria-label', 'pages'); set('#btnUndo', 'aria-label', 'undo');
  set('#btnRedo', 'aria-label', 'redo'); set('#btnEdMore', 'aria-label', 'more'); set('#textEd', 'aria-label', 'text');
  set('#tray', 'aria-label', 'tools'); set('#fab', 'aria-label', 'addPage'); set('#panel', 'aria-label', 'nbPages');
  set('#panelClose', 'aria-label', 'close'); set('#btnLang', 'aria-label', 'language');
  $('#panelTitle').textContent = t('pages');
  $('#panelAdd').innerHTML = icon('plus', 20) + '<span></span>'; $('#panelAdd').lastChild.textContent = t('pageToEnd');
  $('#btnAddSubject').innerHTML = icon('folder', 19) + '<span></span>'; $('#btnAddSubject').lastChild.textContent = t('subject');
  $('#btnAddNb').innerHTML = icon('plus', 19) + '<span></span>'; $('#btnAddNb').lastChild.textContent = t('notebook');
  $('#btnLang').innerHTML = icon('globe', 17) + '<span>' + LANGS.find((l) => l.k === LANG).short + '</span>';
}
function langItems() {
  return LANGS.map((l) => ({ label: l.name, check: l.k === LANG, onClick: () => setLang(l.k) }));
}
function setLang(k) {
  if (!I18N[k] || k === LANG) return;
  LANG = k; P.lang = k; savePrefs();
  layoutCache = new WeakMap();
  applyStatic();
  renderLibrary();
  if (S.nb) {
    closePopover(); buildTray(); lastTop = ''; S.ruler.drawnZ = 0;
    if (S.sel && !selbar.hidden) buildSelbar();
    if (!$('#panel').hidden) renderPanel();
    requestRender();
  }
}

/* ================= editor chrome wiring ================= */
function initChrome() {
  $('#btnBack').innerHTML = icon('back');
  $('#btnUndo').innerHTML = icon('undo');
  $('#btnRedo').innerHTML = icon('redo');
  $('#btnEdMore').innerHTML = icon('more');
  $('#fab').innerHTML = icon('plus', 26);
  $('#panelClose').innerHTML = icon('close');
  $('#btnLibMore').innerHTML = icon('more');
  applyStatic();
  $('#btnLang').addEventListener('click', (e) => showMenu(e.currentTarget, langItems()));
  $('#searchIc').innerHTML = icon('search', 19);

  $('#btnBack').addEventListener('click', closeNotebook);
  $('#btnTitle').addEventListener('click', () => openNotebookSheet(S.nb));
  $('#btnUndo').addEventListener('click', () => undo());
  $('#btnRedo').addEventListener('click', () => redo());
  $('#btnZoom').addEventListener('click', () => {
    const p = currentPage(); const wc = s2w(VW / 2, VH * 0.4);
    S.cam.z = fitZoom(); S.cam.x = -VW / S.cam.z / 2; S.cam.y = wc.y - VH * 0.4 / S.cam.z;
    if (p) clampCam(); requestRender();
  });
  $('#btnLock').addEventListener('click', () => { const p = currentPage(); if (p) openPageSheet(p); });
  $('#btnPages').addEventListener('click', () => { const pn = $('#panel'); pn.hidden = !pn.hidden; if (!pn.hidden) renderPanel(); });
  $('#panelClose').addEventListener('click', () => { $('#panel').hidden = true; });
  $('#panelAdd').addEventListener('click', () => addPage(S.pages[S.pages.length - 1]));
  $('#fab').addEventListener('click', () => addPage(currentPage()));
  $('#btnEdMore').addEventListener('click', (e) => showMenu(e.currentTarget, [
    { label: t('pageSizeBg'), icon: 'page', onClick: () => openPageSheet(currentPage()) },
    { label: t('insertPhoto'), icon: 'image', onClick: insertImage },
    { label: t('addPdfPages'), icon: 'file', onClick: importPdfHere },
    { label: t('savePdfNb'), icon: 'download', onClick: () => exportNotebookPdf(S.nb) },
    '-',
    { label: t('fingerDraw'), icon: 'hand', check: !!P.fingerDraw, onClick: () => { P.fingerDraw = !P.fingerDraw; P.fingerSet = true; savePrefs(); toast(P.fingerDraw ? t('fingerOn') : t('fingerOff')); } },
    { label: t('nbSettings'), icon: 'edit', onClick: () => openNotebookSheet(S.nb) },
    { label: t('language') + ' · ' + LANGS.find((l) => l.k === LANG).short, icon: 'globe', onClick: () => showMenu($('#btnEdMore'), langItems()) },
  ]));
  $('#btnAddSubject').addEventListener('click', () => openSubjectSheet(null));
  $('#btnAddNb').addEventListener('click', () => openNotebookSheet(null));
  $('#btnLibMore').addEventListener('click', (e) => showMenu(e.currentTarget, [
    { label: t('saveBackup'), icon: 'download', onClick: exportBackup },
    { label: t('restoreBackup'), icon: 'upload', onClick: importBackup },
    '-',
    { label: t('whereStored'), icon: 'info', onClick: showStorageInfo },
  ]));
  $('#q').addEventListener('input', (e) => { S.query = e.target.value; renderLibrary(); });

  document.addEventListener('keydown', (e) => {
    if ($('#editor').hidden) return;
    const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (typing) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (mod && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    else if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { e.preventDefault(); deleteSel(); }
    else if (e.key === 'Escape') { clearSel(); closePopover(); }
    else if (!mod) { const map = { p: 'pen', h: 'hl', e: 'eraser', l: 'lasso', t: 'text' }; if (map[e.key]) setTool(map[e.key]); }
  });

  new ResizeObserver(() => { if ($('#editor').hidden) return; sizeCanvases(); clampCam(); render(); }).observe(stage);
  window.addEventListener('resize', () => { if (!$('#editor').hidden) { sizeCanvases(); clampCam(); render(); } });
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const themeChanged = () => { readColors(); S.ruler.drawnZ = 0; requestRender(); };
  if (mq.addEventListener) mq.addEventListener('change', themeChanged);
  new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(true); });
  window.addEventListener('pagehide', () => flush(true));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutCache = new WeakMap(); for (const p of S.pages) bump(p); S.ruler.drawnZ = 0; });
}

/* ================= boot ================= */
async function boot() {
  readColors();
  initChrome();
  getDownloads();
  S.persistent = await Store.init();
  try { S.subjects = await Store.all('subjects'); S.notebooks = await Store.all('notebooks'); } catch (e) { S.subjects = []; S.notebooks = []; }
  if (!S.subjects.length && !S.notebooks.length && (!P.seeded || !S.persistent)) {
    try { await seedSample(); P.seeded = true; savePrefs(); } catch (e) { /* ignore */ }
  }
  if (!S.persistent) $('#libWarn').append(el('div', { class: 'warnbar', role: 'alert' }, t('storageBar')));
  renderLibrary();
}
boot();
})();
