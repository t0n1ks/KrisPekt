<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2343B0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>KrisPekt</title>
  </head>
  <body>
    <div id="app">
      <section class="library" id="library">
        <div class="library__inner">
          <div class="library__head">
            <div>
              <h1 class="library__brand">KrisPekt</h1>
              <p class="library__subtitle" id="libSub"></p>
              <p class="library__backup" id="libBackup"></p>
            </div>
            <div class="library__actions">
              <button class="btn" id="btnAddSubject" type="button"></button>
              <button class="btn btn--primary" id="btnAddNb" type="button"></button>
              <button class="pill" id="btnLang" type="button"></button>
              <button class="icon-btn" id="btnLibMore" type="button"></button>
            </div>
          </div>
          <label class="search" for="q"
            ><span id="searchIc"></span><input class="search__input" id="q" type="search" autocomplete="off"
          /></label>
          <div id="libWarn"></div>
          <div id="libBanner"></div>
          <div id="libList"></div>
        </div>
      </section>

      <section class="editor" id="editor" hidden>
        <header class="top-bar">
          <button class="icon-btn" id="btnBack" type="button"></button>
          <button class="top-bar__title" id="btnTitle" type="button">
            <b class="top-bar__title-main" id="edTitle"></b
            ><span class="top-bar__title-sub" id="edSub"></span>
          </button>
          <button class="pill pill--zoom" id="btnZoom" type="button"></button>
          <button class="pill" id="btnLock" type="button"></button>
          <button class="pill" id="btnPages" type="button"></button>
          <button class="icon-btn" id="btnEdMore" type="button"></button>
        </header>
        <div class="text-bar" id="textBar" role="toolbar" hidden></div>
        <div class="stage" id="stage">
          <canvas class="stage__canvas" id="cv"></canvas>
          <canvas class="stage__canvas stage__canvas--live" id="live"></canvas>
          <div class="ruler" id="ruler" hidden>
            <canvas class="ruler__canvas"></canvas><span class="ruler__angle">0°</span>
          </div>
          <div
            class="text-editor"
            id="textEd"
            role="textbox"
            aria-multiline="true"
            hidden
            spellcheck="true"
          ></div>
          <div class="text-frame" id="textFrame" hidden></div>
          <div class="selection-bar" id="selbar" hidden></div>
          <div class="jump-mark" id="jumpMark" hidden></div>
          <button class="back-chip" id="backChip" type="button" hidden></button>
          <button class="page-chip" id="pageChip" type="button"></button>
          <pre class="input-diag" id="inputDiag" hidden></pre>
          <div class="tool-tray" id="tray" role="toolbar"></div>
          <button class="fab" id="fab" type="button"></button>
          <aside class="pages-panel" id="panel" hidden>
            <div class="pages-panel__head">
              <h2 class="pages-panel__title" id="panelTitle"></h2>
              <button class="btn" id="panelSelect" type="button"></button>
              <button class="icon-btn" id="panelClose" type="button"></button>
            </div>
            <p class="pages-panel__hint" id="panelHint"></p>
            <div class="pages-panel__list" id="plist"></div>
            <div class="pages-panel__foot" id="panelFoot" hidden>
              <span class="pages-panel__count" id="panelSelCount"></span>
              <button class="btn" id="panelSelCancel" type="button"></button>
              <button class="btn btn--danger" id="panelDelete" type="button"></button>
            </div>
          </aside>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
